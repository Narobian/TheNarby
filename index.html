<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NARBY's Stuff</title>
    <style>
        /* 1. Global Reset & Retro Grid Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0d11;
            /* Creates a retro synthwave style grid pattern */
            background-image: 
                linear-gradient(to right, rgba(255, 0, 128, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 128, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. Top Navigation Bar */
        .navbar {
            width: 100%;
            background-color: #16161f;
            border-bottom: 2px solid #ff007f;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 2px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
        }
        .nav-links a:hover {
            color: #ff007f;
        }

        /* 3. Main Container Layout */
        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* 4. Retro Glitchy Content Box Layout */
        .window-box {
            background-color: #16161f;
            border: 2px solid #ff007f;
            border-radius: 8px;
            box-shadow: 5px 5px 0px #00ffff;
            margin-bottom: 40px;
            overflow: hidden;
        }
        .window-header {
            background: linear-gradient(90deg, #ff007f, #aa00ff);
            padding: 6px 12px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .window-content {
            padding: 24px;
        }

        /* 5. Typography Customizations */
        h1 {
            color: #00ffff;
            margin-top: 0;
            font-size: 28px;
            text-transform: uppercase;
        }
        .highlight-text {
            color: #ff007f;
            font-weight: bold;
        }

        /* 6. Simple Stat Layouts */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #212130;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-num {
            font-size: 24px;
            color: #ff007f;
            font-weight: bold;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar Menu -->
    <div class="navbar">
        <div class="logo">NARBY // PORTFOLIO</div>
        <div class="nav-links">
            <a href="#profile">01 INFORMATION</a>
            <a href="#songs">02 PICTURES</a>
        </div>
    </div>

    <div class="container">

        <!-- Main Introduction Window Card -->
        <div id="profile" class="window-box">
            <div class="window-header">
                <span>PROFILE.EXE</span>
                <span>✖</span>
            </div>
            <div class="window-content">
                <h1>Kamusta mga tao ng mundo.</h1>
                <p>Welcome to the randomness of Narby <span class="highlight-text">A human but still a Idiot</span> Style by me</p>
                <p>This layout is built with custom CSS grid patterns, bright neon box shadows, and retro block containers.</p>
            </div>
        </div>
